services:
  db:
    image: postgres:15-alpine
    container_name: legacy_postgres
    environment:
      POSTGRES_DB: legacy_erp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d legacy_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: superglue_ingestion_gateway
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: legacy_erp
      DB_USER: admin
      DB_PASSWORD: secretpassword
      SUPERGLUE_API_URL: http://localhost:8080/api/v1/ingest
      SUPERGLUE_API_KEY: sg_live_mock_key_998877
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
